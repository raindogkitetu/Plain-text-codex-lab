name: Sonnet-2 Team Scout

on:
  push:
    paths:
      - '.github/workflows/sonnet-team-scout.yml'
      - 'scripts/sonnet_team_scout.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnet-2-team-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read candidate team rooms
        run: node scripts/sonnet_team_scout.mjs
      - name: Persist scout result
        shell: bash
        run: |
          git config user.name "sonnet-team-scout"
          git config user.email "sonnet-team-scout@users.noreply.github.com"
          git add data/sonnet_team_scout.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Sonnet team scout [skip ci]"
          git pull --rebase origin main
          git push origin main

# trigger: urgent candidate-room read
# trigger: post-discovery recheck
