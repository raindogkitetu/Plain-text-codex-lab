name: Sonnet-2 Rules Status Read

on:
  push:
    paths:
      - '.github/workflows/sonnet-rules-status-read.yml'
      - 'scripts/sonnet_rules_status_read.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnet-2-rules-status-read
  cancel-in-progress: true

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read referee rules status
        run: node scripts/sonnet_rules_status_read.mjs
      - name: Persist status result
        shell: bash
        run: |
          git config user.name "sonnet-rules-status-read"
          git config user.email "sonnet-rules-status-read@users.noreply.github.com"
          git add data/sonnet_rules_status_read.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update Sonnet rules status read [skip ci]"
          git pull --rebase origin main
          git push origin main
