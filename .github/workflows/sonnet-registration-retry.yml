name: Sonnet-2 Registration Retry Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Local signing policy
        run: |
          echo "Disabled: Technocore DID signing must remain local on the user's Mac."
