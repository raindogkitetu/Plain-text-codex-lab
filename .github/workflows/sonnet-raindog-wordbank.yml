name: Sonnet-2 Raindog Word Bank

on:
  push:
    paths:
      - '.github/workflows/sonnet-raindog-wordbank.yml'
      - 'scripts/sonnet_raindog_wordbank.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build verified DID-compatible word bank
        run: node scripts/sonnet_raindog_wordbank.mjs
      - name: Persist word bank
        shell: bash
        run: |
          git config user.name "sonnet-wordbank"
          git config user.email "sonnet-wordbank@users.noreply.github.com"
          git add data/sonnet_raindog_wordbank.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Sonnet DID word bank [skip ci]"
          git pull --rebase origin main
          git push origin main
