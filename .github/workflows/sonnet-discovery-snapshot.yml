name: Sonnet-2 Discovery Snapshot

on:
  push:
    paths:
      - '.github/workflows/sonnet-discovery-snapshot.yml'
      - 'scripts/sonnet_discovery_snapshot.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnet-2-discovery-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read discovery and summarize teams
        run: node scripts/sonnet_discovery_snapshot.mjs
      - name: Persist snapshot
        shell: bash
        run: |
          git config user.name "sonnet-discovery-snapshot"
          git config user.email "sonnet-discovery-snapshot@users.noreply.github.com"
          git add data/sonnet_discovery_snapshot.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Sonnet discovery snapshot [skip ci]"
          git pull --rebase origin main
          git push origin main

# trigger: urgent pre-deadline discovery read
# trigger: verify raindog join-interest post
