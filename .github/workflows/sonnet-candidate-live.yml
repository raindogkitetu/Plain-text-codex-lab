name: Sonnet-2 Live Candidate Scout

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/sonnet-candidate-live.yml'
      - 'scripts/sonnet_candidate_live.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnet-2-live-candidate-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate live fallback teams
        run: node scripts/sonnet_candidate_live.mjs
      - name: Persist shortlist
        shell: bash
        run: |
          git config user.name "sonnet-candidate-live"
          git config user.email "sonnet-candidate-live@users.noreply.github.com"
          git add data/sonnet_candidate_live.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Sonnet live candidate shortlist [skip ci]"
          git pull --rebase origin main
          git push origin main
