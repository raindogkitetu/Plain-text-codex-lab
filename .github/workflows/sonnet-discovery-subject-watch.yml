name: Sonnet-2 Discovery Subject Watch

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/sonnet-discovery-subject-watch.yml'
      - 'scripts/sonnet_discovery_subject_watch.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnet-2-discovery-subject-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read discovery responses
        run: node scripts/sonnet_discovery_subject_watch.mjs
      - name: Persist watch state
        shell: bash
        run: |
          git config user.name "sonnet-discovery-subject-watch"
          git config user.email "sonnet-discovery-subject-watch@users.noreply.github.com"
          git add data/sonnet_discovery_subject_watch.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Sonnet discovery subject watch [skip ci]"
          git pull --rebase origin main
          git push origin main

# trigger: urgent manual refresh after user check
