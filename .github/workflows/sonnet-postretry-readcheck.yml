name: Sonnet-2 Post-Retry READ Check

on:
  push:
    paths:
      - '.github/workflows/sonnet-postretry-readcheck.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnet-2-postretry-readcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Read Technocore and verify registration/receipt signatures
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const ROOM = 'mb-sonnet-2-registration';
          const CONTEST = 'sonnet-2';
          const REQUEST_ID = 'register-raindog-writer-acf7b45a0344e497';
          const SUBJECT_DID = 'did:key:z6MkpLFbURxSo93yf4njy2KSsFNLkixNnKALs2wEsEM15fx4';
          const REFEREE_DID = 'did:key:z6MkowHQwsx9xr84WbWN3YCnKutyBnBXkT1ChKY4uEAAMzte';
          const EXPECTED_TEXT = '{"type":"sonnet.register.v1","contest_id":"sonnet-2","role":"writer","x_account_url":"https://x.com/raindog_kitetu","request_id":"register-raindog-writer-acf7b45a0344e497"}';
          const OUT = 'data/sonnet_postretry_readcheck.json';
          const MONITOR = 'data/sonnet_receipt_monitor_state.json';
          const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          const IDX = new Map([...B58].map((c,i)=>[c,i]));

          function b58decode(raw) {
            let n=0n;
            for (const ch of raw) { const d=IDX.get(ch); if (d==null) throw new Error('bad base58'); n=n*58n+BigInt(d); }
            let hex=n.toString(16); if (hex.length%2) hex='0'+hex;
            let body=hex?Buffer.from(hex,'hex'):Buffer.alloc(0);
            const lead=raw.length-raw.replace(/^1+/,'').length;
            if (lead) body=Buffer.concat([Buffer.alloc(lead),body]);
            return body;
          }
          function pub(did) {
            if (!did.startsWith('did:key:z')) throw new Error('bad did');
            const d=b58decode(did.slice('did:key:z'.length));
            if (d.length!==34 || d[0]!==0xed || d[1]!==0x01) throw new Error('not ed25519');
            return crypto.createPublicKey({key:Buffer.concat([Buffer.from('302a300506032b6570032100','hex'),d.subarray(2)]),format:'der',type:'spki'});
          }
          function verify(msg,did) {
            try {
              if (!msg || msg.from!==did || msg.nonce==null || typeof msg.text!=='string' || !msg.sig) return false;
              return crypto.verify(null,Buffer.from(`${ROOM}|${msg.nonce}|${msg.text}`,'utf8'),pub(did),Buffer.from(msg.sig,'base64url'));
            } catch { return false; }
          }
          function deep(obj, keys) {
            if (!obj || typeof obj!=='object') return null;
            for (const k of keys) if (obj[k]!=null) return obj[k];
            for (const v of Object.values(obj)) if (v && typeof v==='object') { const x=deep(v,keys); if (x!=null) return x; }
            return null;
          }
          function inspect(messages, state) {
            for (const m of messages) {
              if (!state.registration_message_found && m?.from===SUBJECT_DID && m?.text===EXPECTED_TEXT && verify(m,SUBJECT_DID)) {
                state.registration_message_found=true;
                state.registration_seq=Number(m.seq||0)||null;
                state.registration_ts=m.ts||null;
                state.registration_signature_verified=true;
              }
              if (!state.receipt && m?.from===REFEREE_DID && verify(m,REFEREE_DID)) {
                let p; try { p=JSON.parse(m.text); } catch { continue; }
                if (p?.type!=='sonnet.receipt.v1') continue;
                if (p?.contest_id && p.contest_id!==CONTEST) continue;
                if (String(deep(p,['request_id'])||'')!==REQUEST_ID) continue;
                const pd=deep(p,['participant_did','sender_did','did']);
                if (pd && String(pd)!==SUBJECT_DID) continue;
                const raw=String(deep(p,['status','decision'])||'unknown').toLowerCase();
                const decision=raw==='accepted'?'ACCEPTED':((raw==='rejected'||raw==='refused')?'REFUSED':raw.toUpperCase());
                state.receipt={seq:Number(m.seq||0)||null,ts:m.ts||null,decision,reason:deep(p,['reason','reason_code','error'])??null,participant_did:pd??null,referee_did:REFEREE_DID,signature_verified:true};
              }
            }
          }
          async function text(url,ms=15000) {
            const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
            try { const r=await fetch(url,{headers:{'user-agent':'raindog-sonnet-postretry-readcheck/1.0','cache-control':'no-cache'},signal:c.signal}); if(!r.ok) throw new Error(`HTTP ${r.status}`); return await r.text(); }
            finally { clearTimeout(t); }
          }
          async function main() {
            let previous={}; try { previous=JSON.parse(fs.readFileSync(MONITOR,'utf8')); } catch {}
            let cursor=Number(previous.cursor||0);
            const state={schema_version:1,checked_at:new Date().toISOString(),room:ROOM,contest:CONTEST,request_id:REQUEST_ID,subject_did:SUBJECT_DID,referee_did:REFEREE_DID,start_cursor:cursor,registration_message_found:false,registration_seq:null,registration_ts:null,registration_signature_verified:false,receipt:null,export_scanned:false,incremental_read_succeeded:false,history_gap:null,last_seq:cursor,technocore_write_count:0};
            try {
              const raw=await text(`https://technocore.chat/r/${ROOM}/export?n=${Date.now()}`,10000);
              state.export_scanned=true;
              const recs=raw.split(/\r?\n/).filter(Boolean).map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean);
              inspect(recs,state);
            } catch(e) { state.export_error=`${e?.name||'Error'}:${e?.message||String(e)}`; }
            if (!state.receipt || !state.registration_message_found) {
              for (let i=0;i<40;i++) {
                let v;
                try { v=JSON.parse(await text(`https://technocore.chat/r/${ROOM}?format=json&since=${cursor}&limit=200&wait=0&n=${Date.now()}`,15000)); state.incremental_read_succeeded=true; }
                catch(e) { state.read_error=`${e?.name||'Error'}:${e?.message||String(e)}`; break; }
                const first=v.first_seq==null?null:Number(v.first_seq);
                const last=Number(v.last_seq||cursor);
                state.last_seq=Math.max(state.last_seq,last);
                if (first!=null && first>cursor+1) { state.history_gap={from_cursor:cursor,first_retained_seq:first}; cursor=first-1; continue; }
                const msgs=Array.isArray(v.messages)?v.messages:[];
                inspect(msgs,state);
                if (state.receipt && state.registration_message_found) break;
                if (last<=cursor) break;
                cursor=last;
                if (msgs.length<200) break;
              }
            }
            state.status=state.receipt?.decision || 'PENDING_NO_VERIFIED_RECEIPT';
            fs.mkdirSync('data',{recursive:true});
            fs.writeFileSync(OUT,JSON.stringify(state,null,2)+'\n');
            console.log(JSON.stringify({...state,receipt:state.receipt},null,2));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Persist READ-only result
        shell: bash
        run: |
          git config user.name "sonnet-postretry-readcheck"
          git config user.email "sonnet-postretry-readcheck@users.noreply.github.com"
          git add data/sonnet_postretry_readcheck.json
          git commit -m "chore: record sonnet post-retry read check [skip ci]"
          git pull --rebase origin main
          git push origin main
