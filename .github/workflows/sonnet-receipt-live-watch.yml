name: Sonnet-2 Receipt Live Watch

on:
  push:
    paths:
      - '.github/workflows/sonnet-receipt-live-watch.yml'
      - 'scripts/sonnet_receipt_live_watch.mjs'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnet-2-receipt-live-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Long-poll Technocore READ only
        run: node scripts/sonnet_receipt_live_watch.mjs

      - name: Persist watcher state
        if: always()
        shell: bash
        run: |
          if [ ! -f data/sonnet_receipt_live_watch_state.json ]; then
            exit 0
          fi
          git config user.name "sonnet-receipt-live-watch"
          git config user.email "sonnet-receipt-live-watch@users.noreply.github.com"
          git add data/sonnet_receipt_live_watch_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update sonnet receipt live-watch state [skip ci]"
          git pull --rebase origin main
          git push origin main
