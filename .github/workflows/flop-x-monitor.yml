name: FLOP X Early-Warning Monitor

on:
  push:
    paths:
      - '.github/workflows/flop-x-monitor.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: flop-x-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Read official FLOP X surfaces
        id: collect
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const statePath = 'data/flop_x_monitor_state.json';
          const handles = ['flop_labs', 'CryptoHayes'];
          const keywords = [
            'testnet','mainnet','faucet','rpc','explorer','airdrop','snapshot','claim',
            'yellow paper','yellowpaper','tokenomics','genesis','miner','validator','agent',
            'technocore','tclk','sonnet','launch','release','deadline','did','task','reward',
            'kol','leaderboard','ref link','referral','lottery','gpu','rent','coordinated voting',
            'disqualify','disqualification'
          ];

          fs.mkdirSync('data', { recursive: true });
          let old = null;
          try { old = JSON.parse(fs.readFileSync(statePath, 'utf8')); } catch {}

          function hash(s) { return crypto.createHash('sha256').update(s).digest('hex'); }
          function clean(s) { return s.replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(); }
          async function get(url) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), 15000);
            try {
              const r = await fetch(url, {
                headers: {
                  'user-agent': 'Mozilla/5.0 (compatible; raindog-flop-x-monitor/1.1)',
                  'accept': 'text/html, text/plain, */*',
                  'cache-control': 'no-cache'
                },
                signal: c.signal,
              });
              const text = await r.text();
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return text;
            } finally { clearTimeout(t); }
          }

          function extractPostIds(text, handle) {
            const ids = [];
            const re = new RegExp(`(?:https?:\\/\\/)?(?:x\\.com|twitter\\.com)\\/${handle}\\/status\\/(\\d{8,25})`, 'gi');
            let m;
            while ((m = re.exec(text)) && ids.length < 40) if (!ids.includes(m[1])) ids.push(m[1]);
            return ids;
          }

          function keywordHits(text) {
            const lower = text.toLowerCase();
            return keywords.filter(k => lower.includes(k));
          }

          async function readHandle(handle) {
            const directUrl = `https://x.com/${handle}`;
            const fallbackUrl = `https://r.jina.ai/http://x.com/${handle}`;
            let source = 'UNAVAILABLE';
            let text = '';
            let directError = null;
            let fallbackError = null;

            try {
              const t = await get(directUrl);
              if (t && t.length > 1000 && new RegExp(handle, 'i').test(t)) {
                source = 'DIRECT_X';
                text = t;
              }
            } catch (e) { directError = String(e?.message || e); }

            if (!text) {
              try {
                const t = await get(fallbackUrl);
                if (t && t.length > 200) {
                  source = 'JINA_MIRROR';
                  text = t;
                }
              } catch (e) { fallbackError = String(e?.message || e); }
            }

            const normalized = clean(text);
            return {
              account: `@${handle}`,
              profile_url: directUrl,
              source,
              accessible: !!normalized,
              content_sha256: normalized ? hash(normalized) : null,
              visible_post_ids: extractPostIds(normalized, handle),
              keyword_hits: keywordHits(normalized),
              direct_error: directError,
              fallback_error: fallbackError,
            };
          }

          async function main() {
            const accounts = {};
            for (const h of handles) accounts[h] = await readHandle(h);
            const semantic = Object.fromEntries(handles.map(h => [h, {
              source: accounts[h].source,
              accessible: accounts[h].accessible,
              post_ids: accounts[h].visible_post_ids,
              keyword_hits: accounts[h].keyword_hits,
            }]));

            const state = {
              schema_version: 2,
              checked_at: new Date().toISOString(),
              authority_note: '@flop_labs is the primary FLOP announcement surface. @CryptoHayes is separately watched because FLOP Labs repeatedly republishes his project/airdrop/contest announcements. X signals are early-warning evidence; protocol mechanics are cross-checked against flop.finance and official GitHub.',
              accounts,
              semantic_fingerprint: hash(JSON.stringify(semantic)),
            };

            const baseline = !old;
            const changed = baseline || old.semantic_fingerprint !== state.semantic_fingerprint;
            let important = false;
            if (old) {
              for (const h of handles) {
                const before = old.accounts?.[h]?.visible_post_ids || [];
                const after = accounts[h].visible_post_ids || [];
                if (JSON.stringify(before) !== JSON.stringify(after)) important = true;
              }
            }

            if (changed) fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\nimportant=${important}\n`);
            console.log(JSON.stringify({ baseline, changed, important, state }, null, 2));
          }

          main().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Persist X monitor state
        if: steps.collect.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "flop-x-monitor"
          git config user.email "flop-x-monitor@users.noreply.github.com"
          git add data/flop_x_monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update FLOP X monitor state [skip ci]"
            git push
          fi

      - name: Open early-warning issue for new X signals
        if: steps.collect.outputs.important == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE' > /tmp/x_issue_body.txt
          const s = require('./data/flop_x_monitor_state.json');
          for (const [h,a] of Object.entries(s.accounts)) {
            console.log(`${a.account}: source=${a.source}, accessible=${a.accessible}, visible post IDs=${(a.visible_post_ids || []).join(', ') || 'none parsed'}, keyword hits=${(a.keyword_hits || []).join(', ') || 'none'}\n`);
          }
          console.log('EARLY WARNING: airdrop/contest/testnet claims from X are material and must be captured immediately. Protocol mechanics are then cross-checked against FLOP docs/GitHub; lack of a Yellow Paper ratification does not erase an explicit official eligibility/task announcement on X.');
          NODE
          TITLE='[FLOP X] New official X signal'
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[FLOP X] New official X signal") | .number' | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file /tmp/x_issue_body.txt
          else
            gh issue create --title "$TITLE" --body-file /tmp/x_issue_body.txt
          fi
